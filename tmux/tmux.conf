# tmux config tracked inside ~/.config/nvim (git-managed)
# home ~/.tmux.conf should source this file.

set -g mouse on

# Use C-b as a true one-key leader (not tmux internal prefix table)
set -g prefix None
set -g prefix2 None

# Smart pane navigation between tmux and Neovim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Keymaps grouped like nvim leader groups
source-file ~/.config/nvim/tmux/keymaps.conf

# TPM + plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Which-key: keep startup lighter; plugin can still be used with default menus
set -g @tmux-which-key-disable-autobuild 1

# TPM bootstrap (keep this at bottom)
run-shell "$HOME/.tmux/plugins/tpm/tpm"
