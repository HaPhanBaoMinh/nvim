# tmux config tracked inside ~/.config/nvim (git-managed)
# home ~/.tmux.conf should source this file.

set -g mouse on
set -s set-clipboard on
# Neovim OSC52 copy through tmux → host clipboard (tmux 3.3+)
set -g allow-passthrough on
set -g mode-keys vi

# Pass GUI env into tmux so wl-copy/xclip work inside panes (restart: tmux kill-server).
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_SESSION_TYPE"

if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -s copy-command "wl-copy --type text/plain"'
if-shell 'command -v xclip >/dev/null 2>&1' 'set -s copy-command "xclip -in -selection clipboard"'

# Mouse select in copy-mode: release to copy + exit copy-mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Use C-b as a true one-key leader (not tmux internal prefix table)
set -g prefix None
set -g prefix2 None

# Smart pane navigation between tmux and Neovim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Keymaps grouped like nvim leader groups
source-file ~/.config/nvim/tmux/keymaps.conf

# TPM + plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Which-key: keep startup lighter; plugin can still be used with default menus
set -g @tmux-which-key-disable-autobuild 1

# TPM bootstrap (keep this at bottom)
run-shell "$HOME/.tmux/plugins/tpm/tpm"
